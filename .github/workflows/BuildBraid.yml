name: Build Braid

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test staged Braid
        shell: pwsh
        run: |
          $repl = Join-Path (Join-Path $PWD "stage") "BraidRepl.ps1"
          $output = & pwsh -NoProfile -ExecutionPolicy Bypass -File $repl str "Braid runtime OK" | Out-String
          $output
          if ($LASTEXITCODE -ne 0) {
            throw "Braid smoke test failed with exit code $LASTEXITCODE."
          }
          if ($output -notmatch "Braid runtime OK") {
            throw "Braid smoke test did not produce the expected output."
          }

      - name: Upload staged runtime
        uses: actions/upload-artifact@v4
        with:
          name: braid-stage-${{ matrix.os }}
          path: stage
          if-no-files-found: error
