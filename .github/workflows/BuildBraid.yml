name: Build Braid

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test staged Braid
        shell: pwsh
        run: |
          $repl = Join-Path (Join-Path $PWD "stage") "BraidRepl.ps1"
          $output = & pwsh -NoProfile -ExecutionPolicy Bypass -File $repl str "Braid runtime OK" | Out-String
          $output
          if ($LASTEXITCODE -ne 0) {
            throw "Braid smoke test failed with exit code $LASTEXITCODE."
          }
          if ($output -notmatch "Braid runtime OK") {
            throw "Braid smoke test did not produce the expected output."
          }

      - name: Validate PowerShell module
        shell: pwsh
        run: |
          Test-ModuleManifest ./Braid/Braid.psd1 | Out-Null
          Import-Module ./Braid/Braid.psd1 -Force -WarningAction Stop
          $output = Invoke-Braid -NoBuild str "Braid module OK" | Out-String
          $output
          if ($output -notmatch "Braid module OK") {
            throw "Braid module invocation did not produce the expected output."
          }

      - name: Run Braid tests
        shell: pwsh
        run: |
          $safeOsName = "${{ matrix.os }}" -replace "[^A-Za-z0-9_.-]", "-"
          $logPath = Join-Path "test-results" "braid-tests-$safeOsName.log"
          & (Join-Path "Tests" "Run-BraidTests.ps1") -NoBuild -Suite portable -LogPath $logPath

      - name: Run Windows-only Braid tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $logPath = Join-Path "test-results" "braid-tests-windows-only.log"
          & (Join-Path "Tests" "Run-BraidTests.ps1") -NoBuild -Suite windows -MinimumTests 20 -LogPath $logPath

      - name: Upload Braid test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braid-test-logs-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore

      - name: Upload staged runtime
        uses: actions/upload-artifact@v4
        with:
          name: braid-stage-${{ matrix.os }}
          path: stage
          if-no-files-found: error
